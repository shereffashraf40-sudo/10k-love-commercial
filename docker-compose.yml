services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: love_stories
      POSTGRES_USER: love_app
      POSTGRES_PASSWORD: change-this-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - love_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U love_app -d love_stories"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://love_app:change-this-password@db:5432/love_stories
      SESSION_SECRET: replace-with-a-random-secret-at-least-32-characters-long
      ADMIN_PASSWORD: replace-with-a-unique-password-at-least-16-characters
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  love_db:
